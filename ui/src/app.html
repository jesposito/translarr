<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Translarr - AI subtitle translation for the arr stack." />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      try {
        if (localStorage.getItem('translarr.uiTheme.v1') === 'unicorn') {
          document.documentElement.dataset.theme = 'unicorn';
        }
      } catch {
        // Theme persistence is optional; render the standard skin.
      }
    </script>
    <title>Translarr</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
